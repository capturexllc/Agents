server:
  port: ${PORT:8080}
  shutdown: graceful
  max-http-request-header-size: 16KB
  forward-headers-strategy: framework
spring:
  application:
    name: vamsdest
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-request-size: 1MB
      max-file-size: 1MB
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
vamsdest:
  search:
    api-key: ${TAVILY_API_KEY:}
  bedrock:
    region: ${AWS_REGION:ca-central-1}
    model-id: ${BEDROCK_MODEL_ID:ca.amazon.nova-lite-v1:0}
    guardrail-id: ${BEDROCK_GUARDRAIL_ID:}
    guardrail-version: ${BEDROCK_GUARDRAIL_VERSION:}
  prompts:
    bucket: ${PROMPTS_BUCKET:}
    prefix: ${PROMPTS_PREFIX:}
    cache-seconds: ${PROMPTS_CACHE_SECONDS:300}
  agent:
    max-turns: ${AGENT_MAX_TURNS:8}
    max-searches: ${AGENT_MAX_SEARCHES:4}
    chat-max-searches: ${AGENT_CHAT_MAX_SEARCHES:2}
    max-tokens: ${AGENT_MAX_TOKENS:1500}