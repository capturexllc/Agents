name: deploy-aws

# Verify on every push and pull request. Deploy to AWS from main (dev automatically) or manually (dev or prod).
# Authentication to AWS uses GitHub OIDC; no long-lived AWS keys are stored in GitHub.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Backend tests
        run: mvn -B verify

      - name: Frontend type-check and build
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint CloudFormation / SAM template
        run: |
          pip install cfn-lint
          cfn-lint infra/template.yaml

  deploy:
    name: Deploy to ${{ inputs.environment || 'dev' }}
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment || 'dev' }}
    env:
      STACK_NAME: vamsdest-${{ inputs.environment || 'dev' }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: vamsdest-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build Lambda package
        run: scripts/package-lambda.sh

      - name: Deploy stack
        working-directory: infra
        run: |
          sam deploy \
            --config-env "${{ inputs.environment || 'dev' }}" \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "AppDomainName=${{ vars.APP_DOMAIN_NAME }}" \
              "CertificateArn=${{ vars.CERTIFICATE_ARN }}" \
              "HostedZoneId=${{ vars.HOSTED_ZONE_ID }}" \
              "CognitoDomainPrefix=${{ vars.COGNITO_DOMAIN_PREFIX }}" \
              "TavilySecretArn=${{ vars.TAVILY_SECRET_ARN }}" \
              "AlertEmail=${{ vars.ALERT_EMAIL }}" \
              "BedrockModelId=${{ vars.BEDROCK_MODEL_ID }}" \
              "BedrockGuardrailId=${{ vars.BEDROCK_GUARDRAIL_ID }}" \
              "BedrockGuardrailVersion=${{ vars.BEDROCK_GUARDRAIL_VERSION }}" \
              "WorkerConcurrency=${{ vars.WORKER_CONCURRENCY }}" \
              "EnableWaf=${{ vars.ENABLE_WAF }}"

      - name: Publish web app
        run: scripts/deploy-web.sh "$STACK_NAME" "$AWS_REGION"

      - name: Smoke test
        run: |
          APP_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='AppUrl'].OutputValue | [0]" --output text)
          curl --fail --silent --show-error --location --output /dev/null "$APP_URL"
          # Unauthenticated API calls must be rejected by the JWT authorizer.
          API_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiBaseUrl'].OutputValue | [0]" --output text)
          STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --request POST "$API_URL/api/trips" --header "Content-Type: application/json" --data '{}')
          test "$STATUS" = "401" || { echo "Expected 401 from unauthenticated API call, got $STATUS"; exit 1; }
          echo "Smoke tests passed for $APP_URL"
