apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vamsdest
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    # ssl-redirect needs an HTTP:80 listener to redirect from, so both ports are listed.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # ACM certificate in the same region as the cluster, covering vasolai.com.
    alb.ingress.kubernetes.io/certificate-arn: REPLACE_WITH_ACM_CERTIFICATE_ARN
    # Optional. Uncomment and set only after creating a WAF web ACL in this region (regional scope).
    # alb.ingress.kubernetes.io/wafv2-acl-arn: REPLACE_WITH_REGIONAL_WAF_ACL_ARN
spec:
  ingressClassName: alb
  rules:
    - host: vasolai.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vamsdest
                port:
                  name: http
