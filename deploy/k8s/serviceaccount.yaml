apiVersion: v1
kind: ServiceAccount
metadata:
  name: vamsdest
  labels:
    app.kubernetes.io/name: vamsdest
  annotations:
    # IRSA: the pod gets temporary credentials for this role (bedrock:InvokeModel, bedrock:ApplyGuardrail,
    # secretsmanager:GetSecretValue on the Tavily secret). See docs/DEPLOY-EKS-VASOLAI.md step 4.
    eks.amazonaws.com/role-arn: REPLACE_WITH_IRSA_ROLE_ARN
automountServiceAccountToken: false
