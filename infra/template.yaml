AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  VamsDest travel planner on AWS. Static web app on S3 behind CloudFront; HTTP API (no sign-in);
  API Lambda that queues work; SQS-triggered worker Lambda that runs the Bedrock agents and Tavily searches;
  DynamoDB for trip runs and their event log. See docs/AWS-DEPLOYMENT.md before deploying.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Naming and environment }
        Parameters: [AppName, Environment]
      - Label: { default: Domain and TLS }
        Parameters: [AppDomainName, CertificateArn, HostedZoneId]
      - Label: { default: Alerts }
        Parameters: [AlertEmail]
      - Label: { default: Research and models }
        Parameters: [TavilySecretArn, BedrockModelId, BedrockGuardrailId, BedrockGuardrailVersion]
      - Label: { default: Capacity and limits }
        Parameters: [WorkerConcurrency, RunRetentionHours, AgentMaxSearches, AgentChatMaxSearches, EnableWaf]

Parameters:
  AppName:
    Type: String
    Default: vamsdest
    AllowedPattern: "^[a-z][a-z0-9-]{1,20}$"
  Environment:
    Type: String
    AllowedValues: [dev, prod]
  AppDomainName:
    Type: String
    Default: ""
    Description: Optional custom hostname, for example travel.example.com. Leave empty to serve the app on the default CloudFront URL (no DNS or certificate needed).
  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate ARN in us-east-1 covering AppDomainName. Required only when AppDomainName is set.
  HostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 public hosted zone that contains AppDomainName. Required only when AppDomainName is set.
  AllowedCidrs:
    Type: CommaDelimitedList
    Default: ""
    Description: IPv4 CIDRs allowed to reach the CloudFront app, for example 203.0.113.10/32. Every other IP is blocked when EnableWaf is true.
  AllowedCidrsV6:
    Type: CommaDelimitedList
    Default: ""
    Description: IPv6 CIDRs allowed to reach the CloudFront app, for example 2001:db8::1/128. Browsers that connect over IPv6 are blocked unless listed here.
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional email address for CloudWatch alarms. Leave empty to create the topic without a subscription.
  TavilySecretArn:
    Type: String
    Description: Secrets Manager secret ARN whose SecretString is the Tavily API key. Created outside this stack.
  BedrockModelId:
    Type: String
    Default: ca.amazon.nova-lite-v1:0
  BedrockGuardrailId:
    Type: String
    Default: ""
  BedrockGuardrailVersion:
    Type: String
    Default: ""
  WorkerConcurrency:
    Type: Number
    Default: 5
    MinValue: 2
    MaxValue: 100
    Description: Maximum concurrent research runs. Bounds Bedrock and Tavily spend.
  RunRetentionHours:
    Type: String
    Default: "24"
  AgentMaxSearches:
    Type: String
    Default: "4"
  AgentChatMaxSearches:
    Type: String
    Default: "2"
  EnableWaf:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Attach an AWS WAF web ACL to CloudFront that blocks every IP not in AllowedCidrs. Requires deployment in us-east-1.

Conditions:
  IsProd: !Equals [!Ref Environment, prod]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  HasCustomDomain: !Not [!Equals [!Ref AppDomainName, ""]]
  EnableWaf: !Equals [!Ref EnableWaf, "true"]

Resources:
  # ---------- Data and queue ----------
  RunTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${AppName}-${Environment}-runs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      DeletionProtectionEnabled: !If [IsProd, true, false]

  # Prompt templates and runtime.yml. Read by the worker through the cache in PromptCatalog; uploaded by
  # scripts/upload-prompts.sh. The bundled copies in the jar are the fallback if this bucket is empty.
  PromptBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${AppName}-${Environment}-prompts-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  # RAG chunks: one item per chunk of an uploaded policy or rule document, with its embedding vector.
  RagChunkTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${AppName}-${Environment}-rag-chunks
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      DeletionProtectionEnabled: !If [IsProd, true, false]

  # Vector index for policy search (Amazon S3 Vectors). Pay-per-use, no servers. Each chunk's vector is stored under
  # its chunk key; the text stays in RagChunkTable. Float32, 384 dimensions (all-MiniLM-L6-v2), cosine distance.
  PolicyVectorBucket:
    Type: AWS::S3Vectors::VectorBucket
    Properties:
      VectorBucketName: !Sub ${AppName}-${Environment}-policy-vectors-${AWS::AccountId}

  PolicyVectorIndex:
    Type: AWS::S3Vectors::Index
    Properties:
      VectorBucketName: !Sub ${AppName}-${Environment}-policy-vectors-${AWS::AccountId}
      IndexName: policy-chunks
      DataType: float32
      Dimension: 384
      DistanceMetric: cosine

  JobDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AppName}-${Environment}-jobs-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  JobQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AppName}-${Environment}-jobs
      # Longer than the worker timeout (900s), so an in-flight message is not redelivered while it runs.
      VisibilityTimeout: 960
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobDeadLetterQueue.Arn
        maxReceiveCount: 3

  # ---------- API ----------
  TripHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50

  TripApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AppName}-${Environment}-api
      Description: Creates trips, serves polled events, and queues chat questions.
      Runtime: java21
      Handler: com.vamsdest.lambda.ApiHandler::handleRequest
      CodeUri: ../build/lambda/
      Architectures: [x86_64]
      MemorySize: 512
      Timeout: 10
      Tracing: Active
      Environment:
        Variables:
          TABLE_NAME: !Ref RunTable
          JOB_QUEUE_URL: !Ref JobQueue
          RUN_TTL_HOURS: !Ref RunRetentionHours
          JAVA_TOOL_OPTIONS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RunTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt JobQueue.QueueName
      Events:
        CreateTrip:
          Type: HttpApi
          Properties:
            ApiId: !Ref TripHttpApi
            Path: /api/trips
            Method: POST
        GetEvents:
          Type: HttpApi
          Properties:
            ApiId: !Ref TripHttpApi
            Path: /api/trips/{tripId}/events
            Method: GET
        AskChat:
          Type: HttpApi
          Properties:
            ApiId: !Ref TripHttpApi
            Path: /api/trips/{tripId}/chat
            Method: POST

  TripApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${TripApiFunction}
      RetentionInDays: 30

  # ---------- Worker ----------
  TripWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AppName}-${Environment}-worker
      Description: Runs the specialist agents and coordinator for queued trips and chat questions.
      Runtime: java21
      Handler: com.vamsdest.lambda.WorkerHandler::handleRequest
      CodeUri: ../build/lambda/
      Architectures: [x86_64]
      MemorySize: 2048
      Timeout: 900
      Tracing: Active
      Environment:
        Variables:
          TABLE_NAME: !Ref RunTable
          RUN_TTL_HOURS: !Ref RunRetentionHours
          TAVILY_SECRET_ARN: !Ref TavilySecretArn
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_GUARDRAIL_ID: !Ref BedrockGuardrailId
          BEDROCK_GUARDRAIL_VERSION: !Ref BedrockGuardrailVersion
          AGENT_MAX_SEARCHES: !Ref AgentMaxSearches
          AGENT_CHAT_MAX_SEARCHES: !Ref AgentChatMaxSearches
          PROMPTS_BUCKET: !Ref PromptBucket
          PROMPTS_PREFIX: "v1/"
          PROMPTS_CACHE_SECONDS: "300"
          RAG_TABLE_NAME: !Ref RagChunkTable
          RAG_VECTOR_BUCKET: !Sub ${AppName}-${Environment}-policy-vectors-${AWS::AccountId}
          RAG_VECTOR_INDEX: policy-chunks
          RAG_CACHE_SECONDS: "300"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RunTable
        - DynamoDBReadPolicy:
            TableName: !Ref RagChunkTable
        - Statement:
            - Sid: ReadTavilyKey
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref TavilySecretArn
            - Sid: InvokeNovaOnBedrock
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/${BedrockModelId}
                - arn:aws:bedrock:*::foundation-model/amazon.nova-lite-v1:0
            - Sid: SearchPolicyVectors
              Effect: Allow
              Action: s3vectors:QueryVectors
              Resource: !Sub arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${AppName}-${Environment}-policy-vectors-${AWS::AccountId}/index/policy-chunks
            - Sid: ReadPromptStore
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub ${PromptBucket.Arn}/*
            - Sid: ListPromptStore
              Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt PromptBucket.Arn
            - Sid: UseGuardrail
              Effect: Allow
              Action: bedrock:ApplyGuardrail
              Resource: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/*
      Events:
        Jobs:
          Type: SQS
          Properties:
            Queue: !GetAtt JobQueue.Arn
            BatchSize: 1
            # Caps simultaneous worker invocations without a Lambda reserved-concurrency
            # reservation (new accounts have a 10-execution total limit, so reservations are refused).
            ScalingConfig:
              MaximumConcurrency: !Ref WorkerConcurrency

  # Ingests a document uploaded under v1/rag/ in the prompt bucket: extracts text (PDF pages or Excel rows), chunks
  # it, embeds each chunk with Titan, and replaces the document's chunks in RagChunkTable.
  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AppName}-${Environment}-ingest
      Description: Indexes policy and rule documents (PDF, Excel) for the search_policies agent tool.
      Runtime: java21
      Handler: com.vamsdest.lambda.IngestHandler::handleRequest
      CodeUri: ../build/lambda/
      Architectures: [x86_64]
      MemorySize: 2048
      Timeout: 300
      Tracing: Active
      Environment:
        Variables:
          RAG_TABLE_NAME: !Ref RagChunkTable
          RAG_VECTOR_BUCKET: !Sub ${AppName}-${Environment}-policy-vectors-${AWS::AccountId}
          RAG_VECTOR_INDEX: policy-chunks
          # Name, not !Ref, so the bucket notification does not create a cycle.
          PROMPTS_BUCKET: !Sub ${AppName}-${Environment}-prompts-${AWS::AccountId}-${AWS::Region}
          PROMPTS_PREFIX: "v1/"
          JAVA_TOOL_OPTIONS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RagChunkTable
        - Statement:
            - Sid: ReadPolicyDocuments
              Effect: Allow
              Action: s3:GetObject
              # Built from the bucket name, not !GetAtt, so the bucket notification does not create a cycle.
              Resource: !Sub arn:aws:s3:::${AppName}-${Environment}-prompts-${AWS::AccountId}-${AWS::Region}/v1/rag/*
            - Sid: WritePolicyVectors
              Effect: Allow
              Action:
                - s3vectors:PutVectors
                - s3vectors:DeleteVectors
              Resource: !Sub arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${AppName}-${Environment}-policy-vectors-${AWS::AccountId}/index/policy-chunks
            - Sid: ReadEmbeddingModel
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub arn:aws:s3:::${AppName}-${Environment}-prompts-${AWS::AccountId}-${AWS::Region}/v1/models/*
      Events:
        PolicyDocumentUploaded:
          Type: S3
          Properties:
            Bucket: !Ref PromptBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: v1/rag/

  IngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${IngestFunction}
      RetentionInDays: 30

  TripWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${TripWorkerFunction}
      RetentionInDays: 30

  # ---------- Frontend and edge ----------
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${AppName}-${Environment}-web-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt FrontendBucket.Arn
              - !Sub ${FrontendBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AppName}-${Environment}-${AWS::Region}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${AppName}-${Environment}-${AWS::Region}-security-headers
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: !Sub >-
              default-src 'self';
              connect-src 'self';
              img-src 'self' data: https://images.unsplash.com;
              style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
              font-src 'self' https://fonts.gstatic.com;
              script-src 'self';
              frame-ancestors 'none';
              base-uri 'self'
            Override: true

  AllowedIpSet:
    Type: AWS::WAFv2::IPSet
    Condition: EnableWaf
    Properties:
      Name: !Sub ${AppName}-${Environment}-${AWS::Region}-allowed-ips
      Scope: CLOUDFRONT
      IPAddressVersion: IPV4
      Addresses: !Ref AllowedCidrs

  AllowedIpv6Set:
    Type: AWS::WAFv2::IPSet
    Condition: EnableWaf
    Properties:
      Name: !Sub ${AppName}-${Environment}-${AWS::Region}-allowed-ips-v6
      Scope: CLOUDFRONT
      IPAddressVersion: IPV6
      Addresses: !Ref AllowedCidrsV6

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: EnableWaf
    Properties:
      Name: !Sub ${AppName}-${Environment}-${AWS::Region}-edge
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub ${AppName}-${Environment}-edge
      Rules:
        - Name: BlockNonAllowlistedIps
          Priority: 0
          Action:
            Block: {}
          Statement:
            NotStatement:
              Statement:
                OrStatement:
                  Statements:
                    - IPSetReferenceStatement:
                        ARN: !GetAtt AllowedIpSet.Arn
                    - IPSetReferenceStatement:
                        ARN: !GetAtt AllowedIpv6Set.Arn
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: block-non-allowlisted
        - Name: AwsCommonRules
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: common-rules
        - Name: AwsKnownBadInputs
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: known-bad-inputs
        - Name: RateLimitPerIp
          Priority: 3
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 2000
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: rate-limit

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases: !If [HasCustomDomain, [!Ref AppDomainName], !Ref AWS::NoValue]
        DefaultRootObject: index.html
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        WebACLId: !If [EnableWaf, !GetAtt WebAcl.Arn, !Ref AWS::NoValue]
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: trip-api
            DomainName: !Sub ${TripHttpApi}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: trip-api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref SecurityHeaders

  AppDnsIpv4:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref AppDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt WebDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront's fixed hosted zone ID

  AppDnsIpv6:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref AppDomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt WebDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  # ---------- Alarms ----------
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AppName}-${Environment}-alerts

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Research jobs failed repeatedly and reached the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - { Name: QueueName, Value: !GetAtt JobDeadLetterQueue.QueueName }
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  WorkerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The research worker is failing invocations.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref TripWorkerFunction }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  ApiServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The HTTP API is returning 5xx responses.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - { Name: ApiId, Value: !Ref TripHttpApi }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

Outputs:
  AppUrl:
    Description: Web address of the app (custom domain if set, otherwise the CloudFront URL).
    Value: !If [HasCustomDomain, !Sub "https://${AppDomainName}/", !Sub "https://${WebDistribution.DomainName}/"]
  DistributionDomainName:
    Description: CloudFront domain name for the web app.
    Value: !GetAtt WebDistribution.DomainName
  ApiBaseUrl:
    Description: HTTP API endpoint behind CloudFront (/api/* is served from the same domain).
    Value: !Sub https://${TripHttpApi}.execute-api.${AWS::Region}.amazonaws.com
  RagTableName:
    Description: DynamoDB table of policy document chunks and embeddings.
    Value: !Ref RagChunkTable
  PromptBucketName:
    Description: Bucket that holds prompt templates and runtime.yml (scripts/upload-prompts.sh).
    Value: !Ref PromptBucket
  FrontendBucketName:
    Value: !Ref FrontendBucket
  DistributionId:
    Description: CloudFront distribution to invalidate after a web deploy.
    Value: !Ref WebDistribution
  RunTableName:
    Value: !Ref RunTable
  JobQueueUrl:
    Value: !Ref JobQueue
  AlertTopicArn:
    Value: !Ref AlertTopic
